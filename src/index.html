  <aside class="phone-col" id="phoneCol" aria-label="手机预览">
    <div class="phone-bar">
      <span class="label dot-hint">手机预览</span>
      <button class="ava-btn" id="avaBtn" title="更换预览头像"></button>
      <select class="device-sel" id="deviceSel" aria-label="切换机型"></select>
    </div>
    <div class="phone-stage" id="phoneStage">
      <div class="phone-info" id="phoneInfo"></div>
      <div class="device-box" id="deviceBox">
        <div class="device" id="device">
          <i class="island" aria-hidden="true"></i>
          <div class="device-status" id="deviceStatus"></div>
          <div class="dev-app" id="devApp"></div>
        </div>
      </div>
    </div>
    <div class="status phone-status"><span>@你的账号</span></div>
  </aside>
  <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="拖动调整手机预览宽度" title="拖动调整宽度，双击恢复"></div>

  <section class="center-col" aria-label="编辑与预览">
    <div class="fmt" id="fmt">
      <div class="fmt-side"></div>
      <div class="fmt-mid">
        <span class="stage-label dot-hint" id="stageLabel"></span>
      <button class="btn icon" data-fmt="h2" title="二级标题"><svg class="i"><use href="#i-h2"/></svg></button>
        <button class="btn icon" data-fmt="h3" title="三级标题"><svg class="i"><use href="#i-h3"/></svg></button>
        <span class="sep"></span>
        <button class="btn icon" data-fmt="bold" title="加粗 ⌘B"><svg class="i"><use href="#i-bold"/></svg></button>
        <button class="btn icon" data-fmt="italic" title="强调 ⌘I"><svg class="i"><use href="#i-italic"/></svg></button>
        <button class="btn icon" data-fmt="mark" title="高亮 ⌘⇧H"><svg class="i"><use href="#i-mark"/></svg></button>
        <button class="btn icon" data-fmt="link" title="链接 ⌘K"><svg class="i"><use href="#i-link"/></svg></button>
        <span class="sep"></span>
        <button class="btn icon" data-fmt="quote" title="引用"><svg class="i"><use href="#i-quote"/></svg></button>
        <button class="btn icon" data-fmt="callout" title="提示框"><svg class="i"><use href="#i-callout"/></svg></button>
        <button class="btn icon" data-fmt="ul" title="列表"><svg class="i"><use href="#i-ul"/></svg></button>
        <button class="btn icon" data-fmt="ol" title="编号列表"><svg class="i"><use href="#i-ol"/></svg></button>
        <button class="btn icon" data-fmt="code" title="代码块"><svg class="i"><use href="#i-code"/></svg></button>
        <button class="btn icon" data-fmt="hr" title="分隔线 / 卡片分页"><svg class="i"><use href="#i-hr"/></svg></button>
        <button class="btn icon" data-fmt="image" title="插入图片"><svg class="i"><use href="#i-image"/></svg></button>
      </div>
      <div class="fmt-side right">
        <div id="stageTools"></div>
        <div class="seg" id="modeSeg" role="tablist" aria-label="编辑方式">
          <button data-mode="canvas" aria-pressed="true" title="在排好版的效果上直接编辑">排版</button>
          <button data-mode="md" aria-pressed="false" title="编辑 Markdown 源码">Markdown</button>
        </div>
      </div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="md-pane" id="mdPane" hidden><div class="md-sheet"><div id="editor"></div></div></div>
    <button class="to-top" id="toTop" title="回到顶部" aria-label="回到顶部" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.5v-9M4 7l4-4 4 4"/></svg></button>
    <div class="status" id="status">
      <span><b id="stWords">0</b> 字</span>
      <span>约 <b id="stMin">0</b> 分钟</span>
      <span id="stImgs"></span>
      <span class="grow"></span>
      <span class="saved" id="stSaved"><i></i><span>已保存</span></span>
    </div>
  </section>

  <aside class="insp" aria-label="设置">
    <div class="tabs" role="tablist" id="inspTabs"></div>
    <div class="insp-body" id="inspBody"></div>
  </aside>
</main>
<nav class="mobile-tabs" role="tablist" id="mobileTabs">
  <button role="tab" data-v="canvas" aria-selected="true">编辑</button>
  <button role="tab" data-v="phone" aria-selected="false">手机</button>
  <button role="tab" data-v="style" aria-selected="false">设置</button>
</nav>

<div class="menu" id="fileMenu" role="menu">
  <div class="menu-brand"><svg class="logo" viewBox="0 0 24 28" aria-hidden="true"><use href="#brandLogo"/></svg><span><b>轻排</b><small>排版从简，文思自在。</small></span></div>
  <hr>
  <div class="mh">文稿</div>
  <button data-act="new"><svg class="i"><use href="#i-new"/></svg>新建空白文稿</button>
  <button data-act="sample"><svg class="i"><use href="#i-refresh"/></svg>载入示例文稿</button>
  <button data-act="open"><svg class="i"><use href="#i-open"/></svg>打开 Markdown…<span class="kbd">⌘O</span></button>
  <button data-act="exportMd"><svg class="i"><use href="#i-md"/></svg>下载 .md</button>
  <button data-act="exportHtml"><svg class="i"><use href="#i-html"/></svg>下载公众号 HTML</button>
  <hr>
  <div class="mh">图片</div>
  <button data-act="obsidian"><svg class="i"><use href="#i-folder"/></svg>关联 Obsidian 附件文件夹…</button>
  <button data-act="imagesZip"><svg class="i"><use href="#i-down"/></svg>打包下载文中图片</button>
  <hr>
  <button data-act="keys"><svg class="i"><use href="#i-key"/></svg>快捷键</button>
</div>

<input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
<input type="file" id="imageInput" accept="image/*" multiple hidden>
<input type="file" id="avatarInput" accept="image/*" hidden>
<input type="file" id="folderInput" webkitdirectory multiple hidden>

<div class="drop-veil" id="dropVeil"><div>松开以导入<br><span style="color:var(--text-3)">.md 文件会替换当前文稿，图片会插入到光标处</span></div></div>
<div class="dialog-mask" id="dialog"><div class="dialog" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>/*@@MARKED@@*/</script>
<script>/*@@CODEMIRROR@@*/</script>
<script>/*@@JS@@*/</script>
</body>
</html>
